# This is a Databricks asset bundle definition for ml_diabetes.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: ml_diabetes
  uuid: 27e0d653-808b-4ff5-aefe-6666cb764bce


include:
  - resources/*.yml
  - resources/*/*.yml

artifacts:
  default:
    type: whl
    build: uv build --no-cache --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-cff65afa-2f92.cloud.databricks.com
      profile: dbc-cff65afa-2f92
    variables:
      catalog: training
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-cff65afa-2f92.cloud.databricks.com
      profile: dbc-cff65afa-2f92
      # We explicitly deploy to /Workspace/Users/wafa.almosly@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/wafa.almosly@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: training
      schema: prod
    permissions:
      - user_name: wafa.almosly@gmail.com
        level: CAN_MANAGE

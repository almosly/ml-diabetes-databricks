resources:
  jobs:
    sample_job:
      name: ml_diabetes_job

      tasks:
        - task_key: run_main
          python_wheel_task:
            package_name: ml_diabetes
            entry_point: main
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - ../dist/*.whl
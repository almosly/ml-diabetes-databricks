# The main pipeline for ml_diabetes

resources:
  pipelines:
    ml_diabetes_etl:
      name: ml_diabetes_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/ml_diabetes_etl"

      libraries:
        - glob:
            include: ../src/ml_diabetes_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
